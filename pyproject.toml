[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pathmakers"
version = "0.2.0"
description = "AI-powered personalised learning path recommender"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    "starlette==0.50.0",
    "python-multipart==0.0.21",
    "sse-starlette==3.4.5",

    # Validation
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "annotated-types==0.7.0",
    "email-validator==2.3.0",

    # Graph engine
    "networkx==3.6.1",

    # ML & data
    "scikit-learn==1.8.0",
    "numpy==2.4.1",
    "pandas==2.3.3",
    "joblib==1.5.3",
    "shap==0.52.0",
    "scipy==1.17.0",

    # Utilities
    "python-dotenv==1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
# Run all tests from repo root: python -m pytest backend/ -v
testpaths = ["backend"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "contracts*", "ml*"]
